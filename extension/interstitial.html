<meta charset="utf-8">
<title>focus</title>
<link rel="stylesheet" href="style.css">
<div class="wrap">
  <p class="quote" id="quote"></p>
  <p class="quote-author" id="author"></p>

  <hr>

  <div>
    <span class="phase-chip" id="phase"></span>
    <span class="clock" id="clock"></span>
  </div>

  <div class="tasks" id="tasks"></div>

  <p class="empty" id="target"></p>

  <hr>

  <div class="actions">
    <button class="primary" id="back">Back to work</button>
    <button id="save">Save for later</button>
  </div>

  <!--
    A plain link, deliberately: it works with no JS and with the daemon down,
    which the buttons above cannot claim. It replaces this tab rather than opening
    another, because choosing the dashboard is itself a choice not to go.
  -->
  <p class="center" style="margin-top:1.25rem">
    <a class="quiet-link" href="dashboard.html">edit your tasks on the dashboard</a>
  </p>

  <p class="center" style="margin-top:0.75rem">
    <button class="ghost" id="continue" disabled></button>
  </p>

  <p class="down" id="down" hidden>
    The daemon is not running, so there are no tasks or timer to show — but the
    pause still stands, and continuing gives you the usual few minutes only.
    Start it with <code>systemctl --user start focus-nudge</code>.
  </p>
</div>
<script type="module" src="interstitial.js"></script>
