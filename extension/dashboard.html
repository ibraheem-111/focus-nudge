<meta charset="utf-8">
<title>focus</title>
<link rel="stylesheet" href="style.css">
<div class="wrap">
  <div>
    <span class="phase-chip" id="phase"></span>
    <span class="clock" id="clock"></span>
  </div>
  <p class="empty" id="cycle"></p>
  <p class="empty" id="today"></p>

  <div class="nudging-panel">
    <span class="nudging-line" id="nudging-line"></span>
    <span class="actions inline" id="nudging-off-controls">
      <button class="small" data-hours="1">Off 1h</button>
      <button class="small" data-hours="2">2h</button>
      <button class="small" data-hours="4">4h</button>
      <button class="small" data-hours="">Until I turn it on</button>
    </span>
    <span class="actions inline" id="nudging-on-controls" hidden>
      <button class="primary small" id="nudging-on">Turn nudging on</button>
    </span>
  </div>

  <hr>

  <div class="tasks" id="tasks"></div>
  <div class="new-task-row">
    <input type="text" id="new-task" placeholder="add a micro-task, then press Enter" autocomplete="off">
    <select id="new-task-project" title="Linear project for the new task" hidden></select>
  </div>
  <p><button class="small" id="clear-done" hidden>Clear done</button></p>

  <div class="actions">
    <button class="primary small" id="start">Start</button>
    <button class="small" id="skip">Skip</button>
    <button class="small" id="pause">Pause</button>
    <button class="small" id="stop">Stop</button>
    <button class="small" id="break">Long break</button>
  </div>

  <p><a class="button-link" href="insights.html">Insights — your usage over time</a></p>

  <p id="queue-line" class="empty" hidden></p>
  <p><button class="small" id="drain" hidden>Open saved links</button></p>

  <p class="down" id="down" hidden>
    The daemon is not running. Start it with
    <code>systemctl --user start focus-nudge</code>.
  </p>
</div>
<script type="module" src="dashboard.js"></script>
